[build-system]
requires = ["setuptools>=77.0.3", "cython>=3.1,<=3.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fiona"
dynamic = ["readme", "version"]
authors = [
    {name = "Sean Gillies"},
]
maintainers = [
    {name = "Fiona contributors"},
]
description = "Fiona reads and writes spatial data files"
keywords = ["gis", "vector", "feature", "data"]
license = {text = "BSD 3-Clause"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.10"
dependencies = [
    "attrs>=19.2.0",
    "certifi",
    "click~=8.0",
    "cligj>=0.5",
    'importlib-metadata;python_version<"3.10"',
]

[project.optional-dependencies]
all = ["fiona[calc,s3,test]"]
calc = ["pyparsing", "shapely"]
s3 = ["boto3>=1.3.1"]

[dependency-groups]
build = [
    "build",
    "cython>=3.1,<=3.3",
    "delocate; sys_platform == 'darwin'",
    "setuptools>=77.0.3",
    "wheel",
]
test = [
    "aiohttp",
    "boto3>=1.3.1",
    "fsspec",
    "pytest>=7",
    "pytest-cov>=2.2",
    "pytz",
]
dev = [
    "pre-commit",
    {include-group = "build"},
    {include-group = "tests"},
]

[project.scripts]
fio = "fiona.fio.main:main_group"

[project.urls]
Documentation = "https://fiona.readthedocs.io/"
Repository = "https://github.com/Toblerity/Fiona"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "fiona.__version__"}
readme = {file = ["README.rst", "CHANGES.txt", "CREDITS.txt"]}

[tool.setuptools.packages.find]
include = ["fiona", "fiona.*"]
